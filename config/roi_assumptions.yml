# ROI SCENARIO ASSUMPTIONS — ILLUSTRATIVE ONLY.
#
# Every number in this file is a USER-SUPPLIED ASSUMPTION, not an observed
# outcome. The scenario calculator multiplies these assumptions together to
# show how a decision-maker COULD frame value; it never claims measured ROI,
# savings, or recruitment results. Edit freely; outputs always carry the
# disclaimer below.

disclaimer: >
  Illustrative scenario based entirely on editable assumptions. No figure
  here is derived from observed trial outcomes. Not a forecast and not a
  claim of realized savings.

currency: USD

# Cost assumptions per feasibility review avoided or better targeted.
assumptions:
  # Fully loaded internal cost of one site feasibility review.
  cost_per_feasibility_review: 3500
  # Assumed share of reviews that triage could deprioritize in a cycle.
  # (Assumption, not measured.)
  deprioritized_review_share: 0.20
  # Assumed cost of activating a site that then under-enrolls.
  cost_per_underperforming_site_activation: 30000
  # Assumed number of site activations informed per planning cycle.
  site_activations_per_cycle: 10
  # Assumed share of those activations where competition insight changes
  # the site choice. (Assumption, not measured.)
  activation_decisions_influenced_share: 0.10

scenarios:
  conservative:
    label: Conservative
    review_multiplier: 0.5      # halve the assumed effect
    activation_multiplier: 0.5
  base:
    label: Base
    review_multiplier: 1.0
    activation_multiplier: 1.0
  optimistic:
    label: Optimistic
    review_multiplier: 1.5
    activation_multiplier: 1.5

# Reviews per planning cycle to which triage is applied.
reviews_per_cycle: 40
