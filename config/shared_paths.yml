# ============================================================
# Shared medallion paths — used by all non-ingest-only profiles.
#
# Silver, gold, and DuckDB paths are NOT defined in individual profile
# YAMLs. This file is the single source of truth for the shared write
# destinations. ProfileRegistry injects these paths at load time.
#
# To point a profile at a different warehouse (e.g. for testing), set
# CTI_CONFIG_PATH or pass explicit paths to ProfileRegistry.
# ============================================================

silver: data/silver
gold: data/gold
duckdb: data/warehouse/clinical_trials.duckdb
