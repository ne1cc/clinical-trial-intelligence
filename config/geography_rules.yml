# ============================================================
# Geography normalization rules (U.S.-scope MVP).
# - Non-U.S. records are preserved in silver but flagged unusable for the
#   U.S.-only analysis marts.
# - State values are normalized to two-character abbreviations only when the
#   mapping is unambiguous; otherwise UNKNOWN.
# - No facility geocoding in MVP; geoPoint lat/lon are passed through as-is.
# ============================================================

version: 1

unknown_value: UNKNOWN

us_country_values:
  - United States
  - United States of America
  - USA
  - U.S.
  - US

valid_state_abbreviations:
  [AL, AK, AZ, AR, CA, CO, CT, DE, FL, GA, HI, ID, IL, IN, IA, KS, KY, LA,
   ME, MD, MA, MI, MN, MS, MO, MT, NE, NV, NH, NJ, NM, NY, NC, ND, OH, OK,
   OR, PA, RI, SC, SD, TN, TX, UT, VT, VA, WA, WV, WI, WY,
   DC, PR, GU, VI, AS, MP]

