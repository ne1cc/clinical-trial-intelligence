# Feasibility Review Priority score configuration.
# The score ranks segments for HUMAN feasibility review. It is a triage
# signal built from public registry listings — NOT a recruitment forecast
# and NOT a measure of patient availability.
#
# Must stay consistent with dbt seed feasibility_score_weights.csv
# (tests/test_metrics.py enforces this).

score:
  # Components are each normalized to 0..1 within the scored population
  # before weighting. Weights must sum to 1.0.
  weights:
    normalized_recruiting_trial_count: 0.35
    normalized_recent_recruiting_growth: 0.20
    normalized_sponsor_concentration: 0.20
    normalized_site_overlap: 0.15
    normalized_data_confidence_adjustment: 0.10

  # Min-max normalization; when a component has no spread (max == min),
  # its normalized value is 0 for every segment (no signal, no penalty).
  normalization: min_max

  # Priority bands over the final 0..1 score (inclusive lower bounds).
  bands:
    watch: 0.0
    review: 0.45
    priority_review: 0.70

# Data-confidence adjustment inputs (higher confidence -> higher component,
# because low-confidence segments deserve human review before any action).
data_confidence:
  # Share of the segment's trials flagged 'ok' by record quality checks.
  record_quality_weight: 0.5
  # Run-level usable-location share from mart_data_reliability.
  location_usability_weight: 0.5
