app = "clinical-trial-intelligence"
primary_region = "iad"

[build]

[env]

[[mounts]]
source = "cti_data"
destination = "/app/data"

[http_service]
internal_port = 8501
force_https = true
auto_stop_machines = "off"
auto_start_machines = false
min_machines_running = 1

[[http_service.checks]]
grace_period = "60s"
interval = "15s"
method = "GET"
timeout = "5s"
path = "/_stcore/health"

[[vm]]
size = "shared-cpu-1x"
memory = "512mb"
