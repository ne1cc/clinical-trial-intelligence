[project]
name = "cti-dashboard"
version = "0.1.0"
description = "Clinical Trial Access & Recruitment Competition Intelligence — a local-first analytics platform over public ClinicalTrials.gov registry data."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Alexander" }]
dependencies = [
    "requests>=2.32",
    "tenacity>=8.3",
    "pydantic>=2.7",
    "pandas>=2.2",
    "pyarrow>=16.0",
    "duckdb>=1.0",
    "python-dotenv>=1.0",
    "loguru>=0.7",
    "pyyaml>=6.0",
    "dbt-core>=1.8",
    "dbt-duckdb>=1.8",
    "streamlit>=1.36",
    "plotly>=5.22",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "requests-mock>=1.12",
    "ruff>=0.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]
